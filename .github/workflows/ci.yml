name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Runs the repo's own `test` script rather than a bare `bun test`, so
      # CI and local stay one source of truth. Note it is path-scoped
      # (bun test lib) — a test added outside that path will not run here until
      # the script is widened.
      - run: bun run test

  lint-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_POSTHOG_KEY: placeholder
      NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun run build
      # Crawler-view smoke test (scripts/seo-smoke.ts) against the build above.
      # No backend runs here, so prices come from the fallback ladder.
      # `next start` warns about `output: standalone` but serves the build,
      # public/ included.
      - name: Start the built server
        run: nohup bun run start -- -p 3000 > next-start.log 2>&1 &
      - name: Wait for the server
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/robots.txt && exit 0
            sleep 1
          done
          echo "The server did not answer within 60 seconds"
          exit 1
      - name: SEO smoke test
        run: bun scripts/seo-smoke.ts http://localhost:3000
      - name: Server log
        if: failure()
        run: cat next-start.log || true

  lighthouse:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_POSTHOG_KEY: placeholder
      NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun add --global @lhci/cli
      - run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3) has no patched release and reaches
      # only lint tooling (eslint-config-next > @next/eslint-plugin-next >
      # fast-glob > micromatch > braces). Drop the ignore once braces ships a fix.
      - run: bun audit --audit-level=moderate --ignore=GHSA-vfj7-8cjw-p6xm
